apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web-service
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
        - name: web-service
          image: web-service:v1
          imagePullPolicy: Never
          # Environment variables of the app, how to reach MLFlow.
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-server:5001
          ports:
            - containerPort: 9696
          readinessProbe:
            httpGet:
              path: /health
              port: 9696
            periodSeconds: 5
            timeoutSeconds: 2
          # Keep serving while the pod is removed from Service endpoints, then SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server
spec:
  type: ExternalName
  externalName: host.minikube.internal
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: LoadBalancer
  selector:
    app: web-service
  ports:
    - port: 9696
      targetPort: 9696