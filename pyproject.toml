[project]
name = "mlops-zoomcamp"
version = "0.1.0"
description = "Project to follow MLOps course from Zoomcamp"
readme = "README.md"
authors = [
    { name = "Fabrizio Boninsegna", email = "boninsegnafabrizio@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.111",
    "fastparquet>=2026.9.0",
    "hyperopt>=0.3.0",
    "jupyter>=1.1.1",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
mlops-zoomcamp = "mlops_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
