services:

  mlflow:
    build: ./mlflow-server
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - "./mlflow-server/mlflow:/mlflow-server/mlflow"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

    
  web-service-mlflow:
    build: ./src/web-service-mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
    ports:
      - "127.0.0.1:9696:9696"
    depends_on:
      mlflow:
        condition: service_healthy

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefect-data:/root/.prefect

volumes:
  prefect-data: